# Parameters of the test case `smooth`: sech density dip, ρ = 1 - 0.3 sech(2x), u = U (the state of EulerAP.jl,
# examples/euler_poisson_boltzmann_1d/euler_poisson_boltzmann_1d_smooth.jl, with a uniform drift U). See SPEC §7.
case = "smooth"      # initial data (and exact solution) of this case
domain = [-10.0, 10.0]  # [a, b]
bc = "periodic"       # "periodic" or "wall"
N = 50               # number of cells
lambda = 1.0         # scale parameter λ of the Poisson equation
T = 1.0              # final time
snapshots = []       # extra output times in (0, T)

[scheme]
kind = "shift"       # "shift" (§3.3), "dissipation" (§3.4) or "second" (§4)
# limiter = "minmod" # "second" only: "minmod" or "none" (central slopes)
# c_D = 1.0          # "second" only: D = c_D·Δx²·∂E ρ, (72)
# cfl = 0.4          # "second" only: cfl of (91)

[timestep]
mode = "cfl"         # "cfl": scheme rule; "fixed": Δt = cfl·Δx
cfl = 0.25           # used only when mode = "fixed"
dtmax = inf          # upper bound on Δt/Δx

[init]
U = 0.2              # uniform drift: the at-rest solution moved with speed U (Galilean invariance);
                     # U > max|u| of that solution (≈ 0.066), so u ≠ 0 everywhere and Δt ∝ Δx
