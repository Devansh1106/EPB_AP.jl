# Parameters of the test case `step`: density step (§5.6). See SPEC §7.
case = "step"        # initial data (and exact solution) of this case
domain = [0.0, 1.0]  # [a, b]
bc = "periodic"       # "periodic" or "wall"
N = 200              # number of cells
lambda = 0.1         # scale parameter λ of the Poisson equation
T = 1.0              # final time
snapshots = []       # extra output times in (0, T)

[scheme]
kind = "dissipation" # "shift" (§3.3) or "dissipation" (§3.4)
eta = "local"        # "local" or "global" edge coefficient η
theta = 0.5          # θ of Corollary 3.17
kappa_c = 0.5        # κ = kappa_c·Δx·(max|u| + kappa_s), Remark 3.23
kappa_s = 0.0

[timestep]
mode = "cfl"         # "cfl": scheme rule; "fixed": Δt = cfl·Δx
cfl = 0.25           # used only when mode = "fixed"
dtmax = inf          # upper bound on Δt/Δx
