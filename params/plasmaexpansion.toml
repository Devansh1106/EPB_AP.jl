# Parameters of the test case `plasmaexpansion`: plasma expansion of [1, §7.3] and EulerAP.jl (ρ = 0.5 - atan(πx)/π, u = 0). See SPEC §7.
case = "plasmaexpansion" # initial data of this case (no exact solution)
domain = [-10.0, 40.0] # [a, b]
bc = "neumann"       # [1], EulerAP.jl: ρ, φ Neumann; u = 0 in the left ghost, extrapolated at the right
N = 10000            # number of cells ([1], EulerAP.jl)
lambda = 1e-2        # scale parameter λ of the Poisson equation ([1]: ε = 1e-2)
T = 3.0              # final time (EulerAP.jl)
snapshots = []       # extra output times in (0, T)

[scheme]
kind = "shift"       # "shift" (§3.3), "dissipation" (§3.4) or "second" (§4); EulerAP.jl uses first order with η
theta = 0.5          # "dissipation" only: θ of Corollary 3.17
kappa_c = 0.5        # κ = kappa_c·Δx·(max|u| + kappa_s), Remark 3.23
kappa_s = 0.0
# limiter = "minmod" # "second" only: "minmod" or "none" (central slopes)
# c_D = 1.0          # "second" only: D = c_D·Δx²·∂E ρ, (72)
# cfl = 0.4          # "second" only: cfl of (91)

[timestep]
mode = "cfl"         # "cfl": scheme rule; "fixed": Δt = cfl·Δx
cfl = 0.25           # used only when mode = "fixed"
dtmax = inf          # upper bound on Δt/Δx
